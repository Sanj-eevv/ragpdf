x-php-build: &php-build
    build:
        dockerfile: ./php/Dockerfile
        target: '${BUILD_TARGET:-app_dev}'
x-php-env: &php-env
    DB_HOST: db
    REDIS_HOST: cache
services:
    server:
        build:
            dockerfile: ./nginx/Dockerfile
        ports:
            - '80:80'
        volumes:
            - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    app:
        <<: *php-build
        volumes:
            - /var/www/html/vendor
            - .:/var/www/html
            - ./php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
        environment:
            <<: *php-env
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
            RERANK_SERVICE_URL: http://rerank:8000
        extra_hosts:
            - host.docker.internal:host-gateway
    horizon:
        <<: *php-build
        volumes:
            - /var/www/html/vendor
            - .:/var/www/html
        environment:
            <<: *php-env
            RERANK_SERVICE_URL: http://rerank:8000
        extra_hosts:
            - host.docker.internal:host-gateway
        command: php artisan horizon
        restart: unless-stopped
        depends_on:
            - db
            - cache
    scheduler:
        <<: *php-build
        volumes:
            - /var/www/html/vendor
            - .:/var/www/html
        environment:
            <<: *php-env
        command: php artisan schedule:work
        restart: unless-stopped
        depends_on:
            - db
            - cache
    node:
        build:
            dockerfile: ./php/Dockerfile
            target: node_dev
        working_dir: /var/www/html
        volumes:
            - /var/www/html/vendor
            - /var/www/html/node_modules
            - .:/var/www/html
        ports:
            - '5173:5173'
        environment:
            <<: *php-env
        command: npm run dev
    db:
        image: pgvector/pgvector:pg18
        volumes:
            - postgres_data:/var/lib/postgresql
        ports:
            - '5432:5432'
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
    cache:
        image: redis:8.8.1-alpine
        ports:
            - '6379:6379'
    rerank:
        build:
            dockerfile: ./rerank/Dockerfile
        ports:
            - '8001:8000'

volumes:
    postgres_data:
